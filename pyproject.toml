[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dup-content-engine"
version = "0.1.47"
description = "Fail-closed laptop media pipeline: script → TTS → stock/synth visuals → FFmpeg → evidence pack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Uladzimir Dabranski", email = "dup@duplabs.dev" }]
keywords = [
  "ffmpeg",
  "shorts",
  "tts",
  "mcp",
  "fail-closed",
  "dup-labs",
  "content-pipeline",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "edge-tts>=6.1.0",
  "httpx>=0.27.0",
  "imageio-ffmpeg>=0.5.0",
  "Pillow>=10.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
youtube = ["google-api-python-client>=2.100.0", "google-auth-oauthlib>=1.2.0"]
voice = []  # ElevenLabs/Azure use httpx + env keys; no extra package required
whisper = ["faster-whisper>=1.0.0"]
avatar = []  # HeyGen uses httpx + HEYGEN_API_KEY
mcp = ["mcp>=1.0.0"]

[project.scripts]
dup-content = "content_engine.cli:main"
dup-content-mcp = "content_engine.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Gruver87/dup-content-engine"
Repository = "https://github.com/Gruver87/dup-content-engine"
Related = "https://github.com/Gruver87/dup-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_engine = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
